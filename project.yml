name: TendieStudio
options:
  bundleIdPrefix: app.tendiestudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"          # Swift 5 language mode; avoids strict-concurrency errors on Xcode 16/26
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only
    CODE_SIGNING_ALLOWED: "NO"    # unsigned; sideload tools re-sign the IPA
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  TendieStudio:
    type: application
    platform: iOS
    sources:
      - path: Sources/TendieStudio
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tendiestudio.TendieStudio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: TendieStudio
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true          # Files app > On My iPhone > TendieStudio
        CFBundleDocumentTypes:
          - CFBundleTypeName: TendieStudio Wallpaper
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.tendiestudio.tendies]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.tendiestudio.tendies
            UTTypeDescription: Tendies Wallpaper
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [tendies]
  TendieStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/TendieStudioTests]
    dependencies:
      - target: TendieStudio
schemes:
  TendieStudio:
    build:
      targets:
        TendieStudio: all
    test:
      targets: [TendieStudioTests]
